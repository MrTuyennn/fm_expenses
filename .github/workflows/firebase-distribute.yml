name: Firebase App Distribution

# Builds a test build and pushes it to Firebase App Distribution testers.
# - push to `dev`     -> flavor dev,  tester group "dev-testers"
# - push to `staging` -> flavor stag, tester group "stag-testers"
# - manual dispatch   -> pick the flavor yourself
#
# Requires (see docs/release-pipeline.md for the full checklist):
#   - A Firebase project with Android/iOS apps registered for each flavor
#   - Secret FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 (base64 of a service account
#     JSON with the "Firebase App Distribution Admin" role)
#   - Secrets FIREBASE_ANDROID_APP_ID_DEV / FIREBASE_ANDROID_APP_ID_STAG
#   - (iOS only, optional until signing exists) FIREBASE_IOS_APP_ID_DEV /
#     FIREBASE_IOS_APP_ID_STAG and the IOS_DIST_* signing secrets
on:
  push:
    branches: [dev, staging]
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to distribute
        required: true
        type: choice
        options: [dev, stag]

concurrency:
  group: firebase-distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-flavor:
    name: Resolve flavor
    runs-on: ubuntu-latest
    outputs:
      flavor: ${{ steps.resolve.outputs.flavor }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.flavor }}" ]; then
            echo "flavor=${{ inputs.flavor }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "flavor=stag" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=dev" >> "$GITHUB_OUTPUT"
          fi

  distribute-android:
    name: Build & distribute Android (${{ needs.resolve-flavor.outputs.flavor }})
    needs: resolve-flavor
    runs-on: ubuntu-latest
    env:
      FLAVOR: ${{ needs.resolve-flavor.outputs.flavor }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: flutter_version
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      # melos.yaml khai `sdkPath: .fvm/flutter_sdk` để local dev dùng FVM có
      # bản Flutter ổn định, nhưng .fvm/ bị gitignore nên không tồn tại trên
      # runner — không tạo lại thì mọi lệnh `melos` fail ngay với lỗi
      # "SDK path is not valid". Symlink này trỏ đúng vào bản Flutter mà
      # flutter-action vừa cài (đúng version .fvmrc) để melos chạy được.
      - name: Point .fvm/flutter_sdk at the installed Flutter (required by melos.yaml sdkPath)
        run: |
          mkdir -p .fvm
          ln -sfn "$(dirname "$(dirname "$(command -v flutter)")")" .fvm/flutter_sdk

      - name: Activate melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Build APK
        working-directory: app
        run: flutter build apk --flavor "$FLAVOR" --dart-define=FLAVOR="$FLAVOR" --release

      - name: Set up Node (for firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Decode service account
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/firebase-sa.json"

      - name: Distribute to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_APP_ID: ${{ env.FLAVOR == 'stag' && secrets.FIREBASE_ANDROID_APP_ID_STAG || secrets.FIREBASE_ANDROID_APP_ID_DEV }}
        run: |
          firebase appdistribution:distribute \
            "app/build/app/outputs/flutter-apk/app-$FLAVOR-release.apk" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FLAVOR-testers" \
            --release-notes "CI build ${{ github.sha }} (${{ github.ref_name }})"

  distribute-ios:
    name: Build & distribute iOS (${{ needs.resolve-flavor.outputs.flavor }})
    needs: resolve-flavor
    if: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 != '' }}
    runs-on: macos-latest
    env:
      FLAVOR: ${{ needs.resolve-flavor.outputs.flavor }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "TODO: this job is scaffolded but not wired up yet."
          echo "Once Apple signing secrets exist, add: certificate/profile import,"
          echo "flutter build ipa --flavor \$FLAVOR --export-options-plist=..., then"
          echo "firebase appdistribution:distribute build/ios/ipa/*.ipa --app \$FIREBASE_IOS_APP_ID"
          echo "See docs/release-pipeline.md."

  ios-not-configured:
    name: iOS distribution skipped (no signing secrets yet)
    needs: resolve-flavor
    if: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::Skipping iOS distribution — IOS_DIST_CERTIFICATE_BASE64 secret is not set yet. See docs/release-pipeline.md."
