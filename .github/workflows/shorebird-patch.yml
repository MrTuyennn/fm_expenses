name: Shorebird patch

# Pushes an OTA code patch on top of an existing Shorebird release, without
# going through the Play Store / App Store review. Requires that a release
# for this flavor/platform/version already exists (see shorebird-release.yml).
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to patch
        required: true
        type: choice
        options: [dev, stag, prod]
      platform:
        description: Platform to patch
        required: true
        type: choice
        options: [android, ios]

jobs:
  patch:
    name: shorebird patch ${{ inputs.platform }} (${{ inputs.flavor }})
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: flutter_version
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Install Shorebird CLI
        run: |
          curl --compressed -o- -L https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "$HOME/.shorebird/bin" >> "$GITHUB_PATH"

      - name: shorebird patch android
        if: inputs.platform == 'android'
        working-directory: app
        run: |
          shorebird patch android \
            --flavor ${{ inputs.flavor }} \
            --dart-define=FLAVOR=${{ inputs.flavor }} \
            --no-confirm
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: shorebird patch ios
        if: inputs.platform == 'ios' && secrets.IOS_DIST_CERTIFICATE_BASE64 != ''
        working-directory: app
        run: |
          shorebird patch ios \
            --flavor ${{ inputs.flavor }} \
            --dart-define=FLAVOR=${{ inputs.flavor }} \
            --no-confirm
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: iOS signing not configured yet
        if: inputs.platform == 'ios' && secrets.IOS_DIST_CERTIFICATE_BASE64 == ''
        run: |
          echo "::warning::Skipping iOS patch — IOS_DIST_CERTIFICATE_BASE64 secret is not set yet. See docs/release-pipeline.md."
