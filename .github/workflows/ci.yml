name: CI

on:
  pull_request:
  push:
    branches: [main, dev, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: flutter_version
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      # melos.yaml khai `sdkPath: .fvm/flutter_sdk` để local dev dùng FVM có
      # bản Flutter ổn định, nhưng .fvm/ bị gitignore nên không tồn tại trên
      # runner — không tạo lại thì mọi lệnh `melos` fail ngay với lỗi
      # "SDK path is not valid". Symlink này trỏ đúng vào bản Flutter mà
      # flutter-action vừa cài (đúng version .fvmrc) để melos chạy được.
      - name: Point .fvm/flutter_sdk at the installed Flutter (required by melos.yaml sdkPath)
        run: |
          mkdir -p .fvm
          ln -sfn "$(dirname "$(dirname "$(command -v flutter)")")" .fvm/flutter_sdk

      - name: Activate melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze all packages
        run: melos run analyze

      - name: Test all packages
        # Most packages have no test/ directory yet — skip those instead of
        # failing CI on missing tests. Packages that DO have tests still run
        # and still fail the build on a real failure.
        run: melos exec --no-fail-fast -- 'if [ -d test ]; then flutter test; else echo "(no test/ directory, skipping)"; fi'

      - name: Check formatting
        run: melos exec -- "dart format --output=none --set-exit-if-changed ."
